name: CI Tests

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    # Set up a temporary PostgreSQL 15 database for this test run
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Map the Prisma connection string to the temporary database
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
      AUTH_SECRET: ci-test-secret-not-used-in-production
      AUTH_GOOGLE_ID: ci-test-google-id
      AUTH_GOOGLE_SECRET: ci-test-google-secret

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install pnpm BEFORE setting up Node to enable caching
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Database Schema
        run: pnpm exec prisma db push

      - name: Run Unit Tests (Vitest)
        run: pnpm run test