name: CI Tests

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Unit and E2E Tests
    runs-on: ubuntu-latest

    # Set up a temporary PostgreSQL 15 database for this test run
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Map the Prisma connection string to the temporary database
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install pnpm BEFORE setting up Node to enable caching
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # You can remove this line if you have 'packageManager' set in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm" # 2. Update cache key from npm to pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile # 3. Equivalent to 'npm ci'

      - name: Setup Database Schema
        run: pnpm exec prisma db push # 4. Replace 'npx' with 'pnpm exec'

      - name: Run Unit Tests (Vitest)
        run: pnpm run test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E Tests (Playwright)
        run: pnpm exec playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7